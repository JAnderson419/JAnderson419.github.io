  description: "Matthew Rogers was a senior Mechanical Engineering student at the University of Vermont whose research focused on automating dielectric reliability testing. He has been a certified aircraft mechanic for five years, bringing practical hands on experience in high-reliability systems. His research interests include high-performance computing and semiconductor fabrication."
