- name: "Erik Iverson"
  level: "MS"
  role: "Electrical Engineering"
  description: "Erik Iverson was a Master’s student in Electrical Engineering at the University of Vermont, specializing in MEMS resonators and power electronics. His research focused on the modeling and integration of piezoelectric devices for on-chip power conversion, leveraging commercial GaN foundry processes and advanced finite element simulation. He has experience in both industry and academia, with prior roles at energy conversion and storage companies."
  start_date: "2024-01-01"
  end_date: "2026-05-31"
  outcome: "Electrical Design Engineer, Dynapower"
