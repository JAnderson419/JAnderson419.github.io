- name: "Marzia Sultana"
  level: PhD
  role: "Electrical Engineering"
  # image: "dan_n.png"
  description: "Marzia Sultana is a PhD student and Graduate Research Assistant in the Anderson Lab at the University of Vermont, focusing on the fabrication and characterization of ferroelectric materials and 2D films for next-generation RF communication systems. Her research involves nanoscale device fabrication using lithography, SEM, AFM, and reflectometry. She joined UVM in January 2025 after earning an M.Sc. and B.Sc. in Electrical and Electronic Engineering from the University of Dhaka, where she gained experience in material characterization techniques such as PXRD, DLS and conducted research on MOF-based water harvesting, sorption-enhanced PVT devices, and COMSOL-based pressure sensor simulations."
  start_date: "2025-01-01"
  # end_date: "2025-05-31"
  # outcome:
  active: true

- name: "Dan Nalepa"
  level: "BS"
  role: "Electrical Engineering"
  image: "dan_n.png"
  description: "Daniel Nalepa was an undergraduate student pursuing a Bachelor of Science in Electrical Engineering at the University of Vermont, with a concentration in semiconductor devices through the Undergraduate Certificate in Semiconductor Engineering and Physics (UCSEP) program. His research focused on the characterization of ferroelectric materials for use in non-volatile memory applications such as FeRAM. Daniel has been investigating polarization hysteresis behavior of potential ferroelectric devices using a Keithley 4200 Parametric Analyzer. His work on this area has contributed to the validation of testing methods for future custom ferroelectric devices using UVM's new deposition tool."
  start_date: "2025-01-01"
  end_date: "2025-05-31"
  outcome: "Test Engineer, GlobalFoundries"
  active: false

- name: "Nate Seibold"
  level: "BS"
  role: "Electrical Engineering"
  image: "nSeibold.png"
  description: "Nate Seibold was an undergraduate pursuing a B.S. in Electrical Engineering with a focus on semiconductor devices through the Certificate in Semiconductor Engineering and Physics. An interest in the fabrication processes of semiconductor devices led to research surrounding the production of SAW devices using bi-layer liftoff lithography. His work focused on the development of a standard process that can be used to enable the high-yield production of devices using these techniques at UVM."
  start_date: "2025-01-01"
  end_date: "2025-05-31"
  outcome:
  active: false

- name: "Ian Cassidy"
  level: "MS"
  role: "Electrical Engineering"
  # image: "dan_n.png"
  description: "Ian Cassidy joined as an undergraduate student in Electrical Engineering at the University of Vermont, focusing on semiconductor engineering and device physics, before continuing on for an MS degree. He is a recipient of the 2026 NSF Graduate Research Fellowship. His research focuses on surface acoustic wave devices on lithium niobate and clean room process optimization."
  start_date: "2025-01-01"
  active: true

- name: "Ryan Anderson"
  level: "MS"
  role: "Electrical Engineering"
  # image: "dan_n.png"
  description: "Ryan Anderson joined as an undergraduate student in Electrical Engineering in the Undergraduate Certificate in Semiconductor Engineering and Physics (UCSEP) before continuing on for an MS degree. His research interests include GaN research and development, specifically in the realm of HV GaN bidirectional HEMTs and GaN resonators. He is the recipient of the 2026 UVM Atwater-Kent award and the 2025 GlobalFoundries award."
  start_date: "2025-09-01"
  active: true

